<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            slate: { 850: '#1a2332' }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .kanban-col { min-height: 420px; }
    .task-card { transition: all 0.2s ease; }
    .task-card:hover { transform: translateY(-2px); }
    .sidebar-link.active { background-color: rgb(37 99 235); color: white; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
      <div class="p-5 border-b border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-primary-600 flex items-center justify-center font-bold text-lg">P</div>
          <div>
            <h1 class="font-bold text-lg leading-tight">PMS</h1>
            <p class="text-xs text-slate-400">Project Manager</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <button onclick="showView('dashboard')" id="nav-dashboard" class="sidebar-link active w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-sm font-medium hover:bg-slate-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Dashboard
        </button>
        <button onclick="showView('projects')" id="nav-projects" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-sm font-medium hover:bg-slate-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Projects
        </button>
      </nav>
      <div class="p-4 border-t border-slate-700 text-xs text-slate-500">
        College Mini Project · LocalStorage
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Top Bar -->
      <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
        <div>
          <h2 id="page-title" class="text-xl font-semibold text-slate-800">Dashboard</h2>
          <p id="page-subtitle" class="text-sm text-slate-500">Overview of your projects & tasks</p>
        </div>
        <div class="flex items-center gap-3">
          <span id="current-date" class="text-sm text-slate-500"></span>
        </div>
      </header>

      <!-- Views -->
      <div class="flex-1 overflow-y-auto p-6">
        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-medium text-slate-500">Total Projects</p>
                  <p id="stat-projects" class="text-3xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-primary-100 text-primary-600 flex items-center justify-center">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-medium text-slate-500">Active Tasks</p>
                  <p id="stat-active" class="text-3xl font-bold text-amber-600 mt-1">0</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-sm font-medium text-slate-500">Completed Tasks</p>
                  <p id="stat-completed" class="text-3xl font-bold text-emerald-600 mt-1">0</p>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
              <h3 class="font-semibold text-slate-800">Recent Projects</h3>
              <button onclick="showView('projects')" class="text-sm text-primary-600 hover:text-primary-700 font-medium">View all →</button>
            </div>
            <div id="recent-projects" class="divide-y divide-slate-100">
              <!-- filled by JS -->
            </div>
          </div>
        </div>

        <!-- PROJECTS VIEW -->
        <div id="view-projects" class="hidden space-y-6">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h3 class="font-semibold text-slate-800 mb-4">Create New Project</h3>
            <form id="project-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Project Name *</label>
                <input type="text" id="project-name" required placeholder="e.g. Website Redesign" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
                <input type="text" id="project-desc" placeholder="Short description" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" />
              </div>
              <div class="flex items-end">
                <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                  Add Project
                </button>
              </div>
            </form>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100">
              <h3 class="font-semibold text-slate-800">All Projects</h3>
            </div>
            <div id="projects-list" class="divide-y divide-slate-100">
              <!-- filled by JS -->
            </div>
          </div>
        </div>

        <!-- KANBAN VIEW -->
        <div id="view-kanban" class="hidden space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <button onclick="showView('projects')" class="text-slate-500 hover:text-slate-700 p-2 rounded-lg hover:bg-slate-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
              </button>
              <div>
                <h3 id="kanban-project-name" class="text-lg font-semibold text-slate-800">Project Name</h3>
                <p id="kanban-project-desc" class="text-sm text-slate-500"></p>
              </div>
            </div>
            <button onclick="openTaskModal()" class="bg-primary-600 hover:bg-primary-700 text-white font-medium py-2.5 px-5 rounded-xl transition flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Add Task
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <!-- To Do -->
            <div class="bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden">
              <div class="px-4 py-3 bg-slate-200/70 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                  <h4 class="font-semibold text-slate-700 text-sm">To Do</h4>
                </div>
                <span id="count-todo" class="text-xs font-medium bg-slate-300 text-slate-700 px-2 py-0.5 rounded-full">0</span>
              </div>
              <div id="col-todo" class="kanban-col p-3 space-y-3 overflow-y-auto max-h-[calc(100vh-280px)]"></div>
            </div>
            <!-- In Progress -->
            <div class="bg-amber-50/50 rounded-2xl border border-amber-200 overflow-hidden">
              <div class="px-4 py-3 bg-amber-100/80 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                  <h4 class="font-semibold text-amber-800 text-sm">In Progress</h4>
                </div>
                <span id="count-inprogress" class="text-xs font-medium bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full">0</span>
              </div>
              <div id="col-inprogress" class="kanban-col p-3 space-y-3 overflow-y-auto max-h-[calc(100vh-280px)]"></div>
            </div>
            <!-- Completed -->
            <div class="bg-emerald-50/50 rounded-2xl border border-emerald-200 overflow-hidden">
              <div class="px-4 py-3 bg-emerald-100/80 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                  <h4 class="font-semibold text-emerald-800 text-sm">Completed</h4>
                </div>
                <span id="count-completed" class="text-xs font-medium bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded-full">0</span>
              </div>
              <div id="col-completed" class="kanban-col p-3 space-y-3 overflow-y-auto max-h-[calc(100vh-280px)]"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Modal -->
  <div id="task-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeTaskModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden relative">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h3 id="modal-title" class="font-semibold text-slate-800">Add New Task</h3>
          <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <form id="task-form" class="p-6 space-y-4">
          <input type="hidden" id="task-id" />
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Title *</label>
            <input type="text" id="task-title" required placeholder="Task title" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
            <textarea id="task-desc" rows="3" placeholder="Optional details..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none resize-none"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Priority</label>
              <select id="task-priority" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none bg-white">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Assignee</label>
              <input type="text" id="task-assignee" placeholder="Name" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Status</label>
            <select id="task-status" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none bg-white">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" onclick="closeTaskModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-medium hover:bg-slate-50 transition">Cancel</button>
            <button type="submit" class="flex-1 py-2.5 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-medium transition">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden transform transition-all duration-300 translate-y-4 opacity-0">
    <div class="bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium">
      <span id="toast-msg"></span>
    </div>
  </div>

  <script>
    // ========== DATA LAYER ==========
    const STORAGE_KEYS = { projects: 'pms_projects', tasks: 'pms_tasks' };

    let projects = JSON.parse(localStorage.getItem(STORAGE_KEYS.projects) || '[]');
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks) || '[]');
    let currentProjectId = null;
    let editingTaskId = null;

    function save() {
      localStorage.setItem(STORAGE_KEYS.projects, JSON.stringify(projects));
      localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // ========== HELPERS ==========
    function priorityBadge(p) {
      const map = {
        high: 'bg-red-100 text-red-700',
        medium: 'bg-amber-100 text-amber-700',
        low: 'bg-emerald-100 text-emerald-700'
      };
      return `<span class="text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full ${map[p] || map.medium}">${p}</span>`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.remove('hidden');
      requestAnimationFrame(() => {
        t.classList.remove('translate-y-4', 'opacity-0');
      });
      setTimeout(() => {
        t.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => t.classList.add('hidden'), 300);
      }, 2200);
    }

    // ========== NAVIGATION ==========
    function showView(view) {
      ['dashboard', 'projects', 'kanban'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
        const nav = document.getElementById(`nav-${v}`);
        if (nav) nav.classList.remove('active');
      });
      document.getElementById(`view-${view}`).classList.remove('hidden');
      const navBtn = document.getElementById(`nav-${view}`);
      if (navBtn) navBtn.classList.add('active');

      const titles = {
        dashboard: ['Dashboard', 'Overview of your projects & tasks'],
        projects: ['Projects', 'Create and manage your projects'],
        kanban: ['Kanban Board', '']
      };
      document.getElementById('page-title').textContent = titles[view][0];
      document.getElementById('page-subtitle').textContent = titles[view][1];

      if (view === 'dashboard') renderDashboard();
      if (view === 'projects') renderProjects();
    }

    // ========== DASHBOARD ==========
    function renderDashboard() {
      const totalProjects = projects.length;
      const activeTasks = tasks.filter(t => t.status !== 'completed').length;
      const completedTasks = tasks.filter(t => t.status === 'completed').length;

      document.getElementById('stat-projects').textContent = totalProjects;
      document.getElementById('stat-active').textContent = activeTasks;
      document.getElementById('stat-completed').textContent = completedTasks;

      const container = document.getElementById('recent-projects');
      if (projects.length === 0) {
        container.innerHTML = `<div class="px-6 py-10 text-center text-slate-400 text-sm">No projects yet. Create one from the Projects tab.</div>`;
        return;
      }
      const recent = [...projects].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
      container.innerHTML = recent.map(p => {
        const pTasks = tasks.filter(t => t.projectId === p.id);
        const done = pTasks.filter(t => t.status === 'completed').length;
        return `
          <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition cursor-pointer" onclick="openKanban('${p.id}')">
            <div>
              <p class="font-medium text-slate-800">${escapeHtml(p.name)}</p>
              <p class="text-xs text-slate-500 mt-0.5">${pTasks.length} tasks · ${done} completed</p>
            </div>
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>`;
      }).join('');
    }

    // ========== PROJECTS ==========
    function renderProjects() {
      const list = document.getElementById('projects-list');
      if (projects.length === 0) {
        list.innerHTML = `<div class="px-6 py-12 text-center text-slate-400 text-sm">No projects created yet. Use the form above to add one.</div>`;
        return;
      }
      list.innerHTML = projects.map(p => {
        const pTasks = tasks.filter(t => t.projectId === p.id);
        const done = pTasks.filter(t => t.status === 'completed').length;
        return `
          <div class="px-6 py-5 flex flex-wrap items-center justify-between gap-4 hover:bg-slate-50 transition">
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-slate-800 truncate">${escapeHtml(p.name)}</p>
              <p class="text-sm text-slate-500 mt-0.5 truncate">${escapeHtml(p.description || 'No description')}</p>
              <p class="text-xs text-slate-400 mt-1">${pTasks.length} tasks · ${done} done · Created ${new Date(p.createdAt).toLocaleDateString()}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openKanban('${p.id}')" class="px-4 py-2 rounded-xl bg-primary-50 text-primary-700 text-sm font-medium hover:bg-primary-100 transition">Open Board</button>
              <button onclick="deleteProject('${p.id}')" class="p-2 rounded-xl text-red-500 hover:bg-red-50 transition" title="Delete project">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('project-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('project-name').value.trim();
      const desc = document.getElementById('project-desc').value.trim();
      if (!name) return;
      projects.push({ id: uid(), name, description: desc, createdAt: Date.now() });
      save();
      document.getElementById('project-form').reset();
      renderProjects();
      showToast('Project created successfully');
    });

    function deleteProject(id) {
      if (!confirm('Delete this project and all its tasks? This cannot be undone.')) return;
      projects = projects.filter(p => p.id !== id);
      tasks = tasks.filter(t => t.projectId !== id);
      save();
      if (currentProjectId === id) {
        currentProjectId = null;
        showView('projects');
      } else {
        renderProjects();
      }
      showToast('Project deleted');
    }

    // ========== KANBAN ==========
    function openKanban(projectId) {
      currentProjectId = projectId;
      const project = projects.find(p => p.id === projectId);
      if (!project) return;
      document.getElementById('kanban-project-name').textContent = project.name;
      document.getElementById('kanban-project-desc').textContent = project.description || '';
      showView('kanban');
      renderKanban();
    }

    function renderKanban() {
      const statuses = ['todo', 'inprogress', 'completed'];
      statuses.forEach(status => {
        const col = document.getElementById(`col-${status}`);
        const projectTasks = tasks.filter(t => t.projectId === currentProjectId && t.status === status);
        document.getElementById(`count-${status}`).textContent = projectTasks.length;

        if (projectTasks.length === 0) {
          col.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No tasks</div>`;
          return;
        }
        col.innerHTML = projectTasks.map(t => `
          <div class="task-card bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
            <div class="flex items-start justify-between gap-2 mb-2">
              <p class="font-medium text-slate-800 text-sm leading-snug">${escapeHtml(t.title)}</p>
              ${priorityBadge(t.priority)}
            </div>
            ${t.description ? `<p class="text-xs text-slate-500 mb-3 line-clamp-2">${escapeHtml(t.description)}</p>` : ''}
            <div class="flex items-center justify-between mt-3">
              <div class="flex items-center gap-1.5">
                ${t.assignee ? `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">${escapeHtml(t.assignee)}</span>` : '<span class="text-xs text-slate-400">Unassigned</span>'}
              </div>
              <div class="flex items-center gap-1">
                <button onclick="editTask('${t.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-primary-600 hover:bg-primary-50 transition" title="Edit">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button onclick="deleteTask('${t.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 transition" title="Delete">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </div>
            <div class="mt-3 pt-3 border-t border-slate-100 flex gap-1.5">
              ${status !== 'todo' ? `<button onclick="moveTask('${t.id}','todo')" class="flex-1 text-[11px] font-medium py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">← To Do</button>` : ''}
              ${status !== 'inprogress' ? `<button onclick="moveTask('${t.id}','inprogress')" class="flex-1 text-[11px] font-medium py-1.5 rounded-lg bg-amber-50 text-amber-700 hover:bg-amber-100 transition">${status === 'todo' ? 'Start →' : '← Progress'}</button>` : ''}
              ${status !== 'completed' ? `<button onclick="moveTask('${t.id}','completed')" class="flex-1 text-[11px] font-medium py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition">Done ✓</button>` : ''}
            </div>
          </div>`).join('');
      });
    }

    function moveTask(id, newStatus) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.status = newStatus;
      save();
      renderKanban();
      showToast(`Moved to ${newStatus === 'todo' ? 'To Do' : newStatus === 'inprogress' ? 'In Progress' : 'Completed'}`);
    }

    function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      tasks = tasks.filter(t => t.id !== id);
      save();
      renderKanban();
      showToast('Task deleted');
    }

    // ========== TASK MODAL ==========
    function openTaskModal(taskId = null) {
      editingTaskId = taskId;
      const modal = document.getElementById('task-modal');
      const form = document.getElementById('task-form');
      form.reset();
      document.getElementById('task-id').value = '';

      if (taskId) {
        const t = tasks.find(x => x.id === taskId);
        if (!t) return;
        document.getElementById('modal-title').textContent = 'Edit Task';
        document.getElementById('task-id').value = t.id;
        document.getElementById('task-title').value = t.title;
        document.getElementById('task-desc').value = t.description || '';
        document.getElementById('task-priority').value = t.priority;
        document.getElementById('task-assignee').value = t.assignee || '';
        document.getElementById('task-status').value = t.status;
      } else {
        document.getElementById('modal-title').textContent = 'Add New Task';
        document.getElementById('task-status').value = 'todo';
      }
      modal.classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
      editingTaskId = null;
    }

    function editTask(id) {
      openTaskModal(id);
    }

    document.getElementById('task-form').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      if (!title || !currentProjectId) return;

      const data = {
        title,
        description: document.getElementById('task-desc').value.trim(),
        priority: document.getElementById('task-priority').value,
        assignee: document.getElementById('task-assignee').value.trim(),
        status: document.getElementById('task-status').value,
        projectId: currentProjectId
      };

      const existingId = document.getElementById('task-id').value;
      if (existingId) {
        const idx = tasks.findIndex(t => t.id === existingId);
        if (idx !== -1) {
          tasks[idx] = { ...tasks[idx], ...data };
          showToast('Task updated');
        }
      } else {
        tasks.push({ id: uid(), ...data, createdAt: Date.now() });
        showToast('Task added');
      }
      save();
      closeTaskModal();
      renderKanban();
    });

    // ========== UTILS ==========
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ========== INIT ==========
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
    });
    showView('dashboard');
  </script>
</body>
</html>
